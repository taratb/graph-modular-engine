
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-modular-engine-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "graph-modular-engine-api==0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_core*"]